services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      QUEUE_NAME: tasks
      PORT: "3000"
      LOG_LEVEL: info
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles:
      - api
      - full

  task-daemon:
    build:
      context: .
      dockerfile: packages/daemon/task/Dockerfile
    environment:
      API_URL: http://api:3000
      POLL_INTERVAL_MS: "5000"
      LOG_LEVEL: info
      DEBUG: "${DEBUG:-0}"
    volumes:
      - ${HOME}/.claude/.credentials.json:/root/.claude/.credentials.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    profiles:
      - task-daemon
      - full

  lark-result-daemon:
    build:
      context: .
      dockerfile: packages/daemon/lark-result/Dockerfile
    environment:
      API_URL: http://api:3000
      POLL_INTERVAL_MS: "5000"
      LOG_LEVEL: info
      LARK_APP_ID: ${LARK_APP_ID}
      LARK_APP_SECRET: ${LARK_APP_SECRET}
      LARK_RECIPIENT_ID: ${LARK_RECIPIENT_ID}
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    profiles:
      - lark-result-daemon
      - full

  task-enrichment-daemon:
    build:
      context: .
      dockerfile: packages/daemon/task-enrichment/Dockerfile
    environment:
      API_URL: http://api:3000
      POLL_INTERVAL_MS: "5000"
      LOG_LEVEL: info
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    profiles:
      - task-enrichment-daemon
      - full

  telegram-result-daemon:
    build:
      context: .
      dockerfile: packages/daemon/telegram-result/Dockerfile
    environment:
      API_URL: http://api:3000
      POLL_INTERVAL_MS: "5000"
      LOG_LEVEL: info
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    profiles:
      - telegram-result-daemon
      - full
