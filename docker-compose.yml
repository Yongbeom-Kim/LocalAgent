services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: packages/migrator/Dockerfile
    environment:
      LOCAL_AGENT_DB_PATH: /data/local-agent.sqlite
    volumes:
      - local-agent-db:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles:
      - full

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      QUEUE_NAME: tasks
      PORT: "3000"
      LOG_LEVEL: info
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles:
      - api
      - full

  task-daemon:
    build:
      context: .
      dockerfile: packages/daemon/task/Dockerfile
    environment:
      API_URL: http://api:3000
      POLL_INTERVAL_MS: "5000"
      TASK_DAEMON_STATUS_PORT: "7070"
      LOG_LEVEL: info
      DEBUG: "${DEBUG:-0}"
      LOCAL_AGENT_DB_PATH: /data/local-agent.sqlite
      LOCAL_AGENT_DB_EXPECTED_SCHEMA_VERSION: "8"
    volumes:
      - ${HOME}/.claude/.credentials.json:/root/.claude/.credentials.json:ro
      - local-agent-db:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    profiles:
      - task-daemon
      - full

  lark-result-daemon:
    build:
      context: .
      dockerfile: packages/daemon/lark-result/Dockerfile
    environment:
      API_URL: http://api:3000
      POLL_INTERVAL_MS: "5000"
      LOG_LEVEL: info
      LARK_APP_ID: ${LARK_APP_ID}
      LARK_APP_SECRET: ${LARK_APP_SECRET}
      LARK_RECIPIENT_ID: ${LARK_RECIPIENT_ID}
      LOCAL_AGENT_DB_PATH: /data/local-agent.sqlite
      LOCAL_AGENT_DB_EXPECTED_SCHEMA_VERSION: "8"
    volumes:
      - local-agent-db:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    profiles:
      - lark-result-daemon
      - full

  task-enrichment-daemon:
    build:
      context: .
      dockerfile: packages/daemon/task-enrichment/Dockerfile
    environment:
      API_URL: http://api:3000
      POLL_INTERVAL_MS: "5000"
      TASK_DAEMON_STATUS_URL: http://task-daemon:7070
      LOG_LEVEL: info
      LOCAL_AGENT_DB_PATH: /data/local-agent.sqlite
      LOCAL_AGENT_DB_EXPECTED_SCHEMA_VERSION: "8"
    volumes:
      - local-agent-db:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    profiles:
      - task-enrichment-daemon
      - full

  telegram-inbound-daemon:
    build:
      context: .
      dockerfile: packages/daemon/telegram-inbound/Dockerfile
    environment:
      API_URL: http://api:3000
      POLL_INTERVAL_MS: "5000"
      LOG_LEVEL: info
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_FORUM_GROUP_ID: ${TELEGRAM_FORUM_GROUP_ID}
      LOCAL_AGENT_DB_PATH: /data/local-agent.sqlite
      LOCAL_AGENT_DB_EXPECTED_SCHEMA_VERSION: "8"
    volumes:
      - local-agent-db:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    profiles:
      - telegram-inbound-daemon
      - full

  telegram-outbound-daemon:
    build:
      context: .
      dockerfile: packages/daemon/telegram-outbound/Dockerfile
    environment:
      API_URL: http://api:3000
      POLL_INTERVAL_MS: "5000"
      LOG_LEVEL: info
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_FORUM_GROUP_ID: ${TELEGRAM_FORUM_GROUP_ID}
      LOCAL_AGENT_DB_PATH: /data/local-agent.sqlite
      LOCAL_AGENT_DB_EXPECTED_SCHEMA_VERSION: "8"
    volumes:
      - local-agent-db:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    profiles:
      - telegram-outbound-daemon
      - full

  lark-listener-daemon:
    build:
      context: .
      dockerfile: packages/daemon/lark-listener/Dockerfile
    environment:
      API_URL: http://api:3000
      LOG_LEVEL: info
      LARK_APP_ID: ${LARK_APP_ID}
      LARK_APP_SECRET: ${LARK_APP_SECRET}
      LOCAL_AGENT_DB_PATH: /data/local-agent.sqlite
      LOCAL_AGENT_DB_EXPECTED_SCHEMA_VERSION: "8"
    volumes:
      - local-agent-db:/data
    depends_on:
      api:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    profiles:
      - lark-listener-daemon
      - full
    restart: unless-stopped

volumes:
  local-agent-db:
