services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - internal

  api-server:
    build:
      context: ../
      dockerfile: packages/api-server/Dockerfile
    ports:
      - "${API_SERVER_PORT:-3000}:3000"
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS}@rabbitmq:5672
      API_KEYS: ${API_KEYS:?API_KEYS is required}
      PORT: "3000"
    depends_on:
      - rabbitmq
    networks:
      - internal

  emitter-worker:
    build:
      context: ../
      dockerfile: packages/worker/Dockerfile
    command: ["node", "dist/main.js", "--mode", "emit"]
    environment:
      API_SERVER_URL: http://api-server:3000
      API_KEY: ${EMITTER_API_KEY:?EMITTER_API_KEY is required}
      WORKER_MODE: emit
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - api-server
    networks:
      - internal

volumes:
  rabbitmq-data:

networks:
  internal:
